[project]
name = "python-cluedo"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.13.1",
    "python-sat[aiger,pblib]>=1.9.dev2,<2",
    "uvicorn>=0.46.0,<0.47",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.15.9"]
dashboard = ["dash>=4.1.0,<5", "pandas>=3.0.2,<4", "plotly>=6.6.0,<7"]
